[project]
name = "endpoint-observatory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcus Linde", email = "181730171+marcuslinde@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.poe.tasks]
dev = "uvicorn endpoint_observatory.main:app --reload"
test = "pytest"

[tool.poe.tasks.check]
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ty check" },
    { cmd = "pytest" },
]
